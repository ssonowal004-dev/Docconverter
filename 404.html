<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<meta name="description" content="The page you are looking for could not be found.">

<style>

body{
font-family:Arial,sans-serif;
background:#f5f6f7;
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#222;
}

.container{
text-align:center;
padding:20px;
}

h1{
font-size:120px;
margin:0;
color:#e8163d;
line-height:1;
}

h2{
font-size:32px;
margin-top:10px;
}

p{
font-size:18px;
color:#666;
margin-top:15px;
}

a{
display:inline-block;
margin-top:30px;
padding:14px 28px;
background:#e8163d;
color:#fff;
text-decoration:none;
border-radius:12px;
font-size:16px;
transition:0.3s;
}

a:hover{
opacity:0.9;
}

</style>

</head>

<body>

<div class="container">

<h1>404</h1>

<h2>Page Not Found</h2>

<p>
Sorry, the page you are looking for does not exist or has been moved.
</p>

<a href="index.html">Back to Home</a>

</div>

</body>

</html>
